<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- КАСКА (заполняет почти весь viewBox) -->
  <g>
    <!-- основной купол -->
    <path d="M32 2
             C15 2 5 14 4 30
             L1 36
             C0 38 0 40 2 41
             C8 44 20 46 32 46
             C44 46 56 44 62 41
             C64 40 64 38 63 36
             L60 30
             C59 14 49 2 32 2 Z"
          fill="#e8771d" stroke="#b95a10" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- верхние рёбра -->
    <path d="M22 5 C23.5 14 25 20 26.5 28" fill="none" stroke="#c9600f" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M32 4 C32 13 32 20 32 28" fill="none" stroke="#c9600f" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M42 5 C40.5 14 39 20 37.5 28" fill="none" stroke="#c9600f" stroke-width="1.6" stroke-linecap="round"/>

    <!-- блик на куполе -->
    <path d="M13 22 C15 13 22 6 30 5"
          fill="none" stroke="#f6a45a" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>

    <!-- боковые «ушки» крепления -->
    <rect x="4" y="32" width="6" height="8" rx="1" fill="#d16a12" stroke="#b95a10" stroke-width="1"/>
    <rect x="54" y="32" width="6" height="8" rx="1" fill="#d16a12" stroke="#b95a10" stroke-width="1"/>

    <!-- нижняя кромка / козырёк -->
    <path d="M2 38 C8 43 19 46 32 46 C45 46 56 43 62 38
             C63.5 41 62 43 58 44.5 C46 48 18 48 6 44.5 C2 43 0.5 41 2 38 Z"
          fill="#c9600f" opacity="0.95"/>
  </g>

  <!-- КЛЮЧИ (крест-накрест), чуть компактнее, чтобы не вылезти -->
  <g transform="translate(32 30)">
    <!-- левый ключ -->
    <g transform="rotate(-45)">
      <path d="M-7 -1.4 H4 A1.4 1.4 0 0 1 5.4 0 A1.4 1.4 0 0 1 4 1.4 H-7 Z"
            fill="#3b4656" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
      <circle cx="-7" cy="0" r="2.6" fill="none" stroke="#3b4656" stroke-width="1.8"/>
      <circle cx="-7" cy="0" r="2.6" fill="none" stroke="#ffffff" stroke-width="1.2"/>
      <circle cx="-7" cy="0" r="0.8" fill="#ffffff"/>
      <rect x="2.4" y="-2.8" width="1.4" height="1.4" fill="#3b4656"/>
      <rect x="0.2" y="-2.8" width="1.4" height="1.4" fill="#3b4656"/>
    </g>

    <!-- правый ключ -->
    <g transform="rotate(45)">
      <path d="M-7 -1.4 H4 A1.4 1.4 0 0 1 5.4 0 A1.4 1.4 0 0 1 4 1.4 H-7 Z"
            fill="#3b4656" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
      <circle cx="-7" cy="0" r="2.6" fill="none" stroke="#3b4656" stroke-width="1.8"/>
      <circle cx="-7" cy="0" r="2.6" fill="none" stroke="#ffffff" stroke-width="1.2"/>
      <circle cx="-7" cy="0" r="0.8" fill="#ffffff"/>
      <rect x="2.4" y="-2.8" width="1.4" height="1.4" fill="#3b4656"/>
      <rect x="0.2" y="-2.8" width="1.4" height="1.4" fill="#3b4656"/>
    </g>
  </g>
</svg>
