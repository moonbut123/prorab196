<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- фон-скругление (опционально, можно убрать) -->
  <rect width="64" height="64" rx="12" fill="#ffffff"/>

  <!-- КАСКА -->
  <g>
    <!-- основной купол -->
    <path d="M32 10
             C20 10 13 19 12 30
             L8 34
             C7 35 7 37 9 38
             C13 40 22 42 32 42
             C42 42 51 40 55 38
             C57 37 57 35 56 34
             L52 30
             C51 19 44 10 32 10 Z"
          fill="#e8771d" stroke="#b95a10" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- верхние рёбра -->
    <path d="M24 12 C25 18 26 22 27 27" fill="none" stroke="#c9600f" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M32 11 C32 17 32 22 32 27" fill="none" stroke="#c9600f" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M40 12 C39 18 38 22 37 27" fill="none" stroke="#c9600f" stroke-width="1.4" stroke-linecap="round"/>

    <!-- блик на куполе -->
    <path d="M18 24 C19 18 24 14 29 13"
          fill="none" stroke="#f6a45a" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>

    <!-- боковые «ушки» крепления -->
    <rect x="12.5" y="30" width="5" height="6.5" rx="1" fill="#d16a12" stroke="#b95a10" stroke-width="1"/>
    <rect x="46.5" y="30" width="5" height="6.5" rx="1" fill="#d16a12" stroke="#b95a10" stroke-width="1"/>

    <!-- нижняя кромка / козырёк -->
    <path d="M10 35 C14 39 22 41 32 41 C42 41 50 39 54 35
             C55 37 54 39 51 40 C43 43 21 43 13 40 C10 39 9 37 10 35 Z"
          fill="#c9600f" opacity="0.9"/>
  </g>

  <!-- КЛЮЧИ (крест-накрест) -->
  <g transform="translate(32 28)">
    <!-- левый ключ -->
    <g transform="rotate(-45)">
      <path d="M-9 -1.6 H5 A1.6 1.6 0 0 1 6.6 0 A1.6 1.6 0 0 1 5 1.6 H-9 Z"
            fill="#3b4656" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round"/>
      <!-- кольцо-головка -->
      <circle cx="-9" cy="0" r="3.2" fill="none" stroke="#3b4656" stroke-width="2.2"/>
      <circle cx="-9" cy="0" r="3.2" fill="none" stroke="#ffffff" stroke-width="1.4"/>
      <circle cx="-9" cy="0" r="1" fill="#ffffff"/>
      <!-- зубчики бородки -->
      <rect x="3" y="-3.2" width="1.6" height="1.6" fill="#3b4656"/>
      <rect x="0.5" y="-3.2" width="1.6" height="1.6" fill="#3b4656"/>
    </g>

    <!-- правый ключ -->
    <g transform="rotate(45)">
      <path d="M-9 -1.6 H5 A1.6 1.6 0 0 1 6.6 0 A1.6 1.6 0 0 1 5 1.6 H-9 Z"
            fill="#3b4656" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round"/>
      <circle cx="-9" cy="0" r="3.2" fill="none" stroke="#3b4656" stroke-width="2.2"/>
      <circle cx="-9" cy="0" r="3.2" fill="none" stroke="#ffffff" stroke-width="1.4"/>
      <circle cx="-9" cy="0" r="1" fill="#ffffff"/>
      <rect x="3" y="-3.2" width="1.6" height="1.6" fill="#3b4656"/>
      <rect x="0.5" y="-3.2" width="1.6" height="1.6" fill="#3b4656"/>
    </g>
  </g>
</svg>
